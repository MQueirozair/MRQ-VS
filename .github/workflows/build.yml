name: build

# Três alvos nativos (Windows, macOS e Linux) + instalador Windows Setup (.exe)
# com atalho automático na Área de Trabalho e Menu Iniciar.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,youtube]"
      - run: ruff check src tests
      - name: Testes
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
      # Os logs brutos do job ficam no Azure Blob (inacessível em ambientes
      # restritos). Transformar as falhas em ANOTAÇÕES do check faz o motivo
      # aparecer direto na página do PR e na API de check-runs.
      - name: Anotar falhas dos testes
        if: failure()
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("/tmp/pytest.log")
          if not log.is_file():
              raise SystemExit(0)
          texto = log.read_text(encoding="utf-8", errors="replace")
          for linha in texto.splitlines():
              if linha.startswith("FAILED"):
                  msg = linha.replace("::", " - ").replace("%", "%25")
                  print("::error title=Pytest::" + msg[:400])
          partes = re.split(r"_{5,} (.+?) _{5,}", texto)
          for i in range(1, min(len(partes) - 1, 24), 2):
              corpo = [t.strip() for t in partes[i + 1].strip().splitlines() if t.strip()]
              detalhe = " | ".join(corpo[-5:])[:800]
              detalhe = detalhe.replace("%", "%25").replace("\n", " ")
              print("::error title=" + partes[i][:80].replace("%", "%25") + "::" + detalhe)
          PY

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            sep: ";"
            icon: "--icon windows/mrq-vs.ico"
            exe: dist/mrq-vs.exe
          - os: macos-latest
            name: macOS-arm64
            sep: ":"
            icon: ""
            exe: dist/mrq-vs
          - os: ubuntu-latest
            name: Linux-x64
            sep: ":"
            icon: ""
            exe: dist/mrq-vs
    runs-on: ${{ matrix.os }}
    env:
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.pyinstaller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install -U pip
          python -m pip install -e . pyinstaller
      - name: Empacotar
        shell: bash
        run: |
          pyinstaller --onefile --console --name mrq-vs \
            ${{ matrix.icon }} \
            --collect-all soundfile \
            --add-data "src/mrqvs/web/index.html${{ matrix.sep }}mrqvs/web" \
            --add-data "src/mrqvs/web/favicon.ico${{ matrix.sep }}mrqvs/web" \
            --add-data "src/mrqvs/web/icone-192.png${{ matrix.sep }}mrqvs/web" \
            --add-data "src/mrqvs/web/icone-512.png${{ matrix.sep }}mrqvs/web" \
            --add-data "src/mrqvs/web/voz/palavras${{ matrix.sep }}mrqvs/web/voz/palavras" \
            src/mrqvs/_build.py
      - name: Conferir o binário
        shell: bash
        run: |
          "${{ matrix.exe }}" --version
          "${{ matrix.exe }}" stems | head -3
      - name: Gerar instalador Windows Setup (.exe com ícone na Área de Trabalho)
        if: matrix.name == 'Windows-x64'
        shell: pwsh
        run: |
          $ver = (python -c "import mrqvs; print(mrqvs.__version__)").Trim()
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $cand = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $cand) { $iscc = $cand }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" "windows\installer.iss"
          if (-not (Test-Path "dist\MRQ-VS-Setup-windows-x64.exe")) {
            throw "Instalador MRQ-VS-Setup-windows-x64.exe não foi gerado"
          }
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: mrq-vs-${{ matrix.name }}
          path: ${{ matrix.exe }}
      - name: Publicar instalador Windows Setup
        if: matrix.name == 'Windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: mrq-vs-Windows-Setup
          path: dist/MRQ-VS-Setup-windows-x64.exe

  # Pacote portátil (.pyz + zip + manifesto com sha256) montado aqui mesmo,
  # no mesmo runner Linux, e anexado ao release junto com os binários.
  portable:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Gerar pacotes e conferir
        run: python -m mrqvs.release
      - uses: actions/upload-artifact@v4
        with:
          name: mrq-vs-portable
          path: |
            dist/mrq-vs-*.pyz
            dist/mrq-vs-*-linux-x64.zip
            dist/release-manifest.json

  release:
    needs: [binary, portable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Empacotar nomes estáveis
        run: |
          mkdir -p out
          cp dist/mrq-vs-Windows-Setup/MRQ-VS-Setup-windows-x64.exe out/MRQ-VS-Setup-windows-x64.exe
          cp dist/mrq-vs-Windows-x64/*.exe out/mrq-vs-windows-x64.exe
          cp dist/mrq-vs-macOS-arm64/mrq-vs out/mrq-vs-macos-arm64
          cp dist/mrq-vs-Linux-x64/mrq-vs out/mrq-vs-linux-x64
          chmod +x out/mrq-vs-macos-arm64 out/mrq-vs-linux-x64
          cp dist/mrq-vs-portable/mrq-vs-*.pyz out/
          cp dist/mrq-vs-portable/mrq-vs-*-linux-x64.zip out/
          cp dist/mrq-vs-portable/release-manifest.json out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
