[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrq-vs"
version = "0.1.27"
description = "Separa músicas em stems, detecta BPM/compasso/acordes, gera clique, guia e ENSAIO L/R de palco."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MRQ" }]
keywords = ["stems", "demucs", "separacao", "audio", "youtube", "bpm", "moises", "cuewee", "multitrack"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Editing",
]

# Só numpy e soundfile entram como obrigatórias: são o suficiente para
# analisar, separar (fallback DSP), exportar WAV e gerar relatório. Tudo o
# mais é opcional e fica nos extras — quem não tem GPU não deve baixar torch.
dependencies = [
  "numpy>=1.23",
  "soundfile>=0.12",
]

[project.optional-dependencies]
# Baixar e buscar no YouTube
youtube = ["yt-dlp>=2024.1.1"]
# Separação por IA principal (≈2 GB de dependências)
ai = ["demucs>=4.0.0"]
# Motor leve em CPU (substituto do Spleeter em Python 3.10+)
leve = ["openunmix>=1.2.1"]
# Separação estado da arte para voz (BS-RoFormer / UVR-MDX)
onnx = ["audio-separator>=0.20"]
# Detecção neural de compasso/downbeats (MIT, CPJKU)
compasso = ["beat-this>=0.1"]
# Desenvolvimento e testes
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
mrq-vs = "mrqvs.cli:main"
mrqvs = "mrqvs.cli:main"

[project.urls]
Homepage = "https://github.com/MQueirozair/MRQ-VS"
Repository = "https://github.com/MQueirozair/MRQ-VS.git"
Issues = "https://github.com/MQueirozair/MRQ-VS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrqvs = ["web/*.html", "web/*.ico", "web/*.png", "web/voz/palavras/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B904", "B905"]
